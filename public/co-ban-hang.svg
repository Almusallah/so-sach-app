<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img"
     aria-labelledby="cbTitle cbDesc">
  <title id="cbTitle">Cô bán hàng chụp tờ giấy ghi tay gửi vào Sổ Sạch</title>
  <desc id="cbDesc">Minh hoạ: một cô bán hàng ở chợ dùng điện thoại chụp tờ giấy ghi tay
    các khoản thu chi trong ngày, rồi gửi vào Sổ Sạch qua Zalo.</desc>

  <defs>
    <linearGradient id="cbBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1EAD9"/>
      <stop offset="1" stop-color="#FBF7EC"/>
    </linearGradient>
    <linearGradient id="cbHat" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#E8C35A"/>
      <stop offset="1" stop-color="#CA9612"/>
    </linearGradient>
    <linearGradient id="cbShirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E8262"/>
      <stop offset="1" stop-color="#084C38"/>
    </linearGradient>
    <linearGradient id="cbTable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E7753"/>
      <stop offset="1" stop-color="#084C38"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" fill="url(#cbBg)"/>
  <circle cx="316" cy="182" r="150" fill="#0B6E4F" opacity=".07"/>
  <circle cx="536" cy="72" r="40" fill="#D4A017" opacity=".18"/>
  <circle cx="92" cy="98" r="22" fill="#0B6E4F" opacity=".13"/>
  <circle cx="566" cy="188" r="13" fill="#0B6E4F" opacity=".13"/>

  <!-- ── vendor, behind the counter ───────────────────────────────── -->
  <g>
    <!-- torso: wide enough to read above the counter line -->
    <path d="M238 356 q4-96 78-96 q74 0 78 96 z" fill="url(#cbShirt)"/>
    <!-- collar of an áo bà ba -->
    <path d="M288 266 q28 22 56 0 l-8 26 q-20 12-40 0z" fill="#084C38" opacity=".5"/>
    <!-- left arm resting on the counter -->
    <path d="M382 306 q34 6 44 34" stroke="#f2c49b" stroke-width="19"
          stroke-linecap="round" fill="none"/>
    <!-- right arm raised, holding the phone -->
    <path d="M256 300 q-40-34-28-78" stroke="#f2c49b" stroke-width="19"
          stroke-linecap="round" fill="none"/>
    <!-- neck + head -->
    <rect x="302" y="222" width="28" height="28" rx="13" fill="#e5ad81"/>
    <!-- búi tóc FIRST, so the head covers its inner half and it reads as a
         bun behind the ear rather than a dark blob on the cheek -->
    <circle cx="352" cy="206" r="15" fill="#26201c"/>
    <circle cx="316" cy="200" r="40" fill="#f2c49b"/>
    <path d="M276 198 q0-44 40-44 q40 0 40 44 q-10-22-40-22 q-30 0-40 22z" fill="#26201c"/>
    <!-- warm face -->
    <path d="M303 197 q5-6 10 0" stroke="#26201c" stroke-width="3.2"
          stroke-linecap="round" fill="none"/>
    <path d="M325 197 q5-6 10 0" stroke="#26201c" stroke-width="3.2"
          stroke-linecap="round" fill="none"/>
    <path d="M309 216 q9 8 18 0" stroke="#b4694f" stroke-width="3.2"
          stroke-linecap="round" fill="none"/>
    <circle cx="294" cy="212" r="6.5" fill="#e79a86" opacity=".5"/>
    <circle cx="340" cy="212" r="6.5" fill="#e79a86" opacity=".5"/>

    <!-- nón lá worn on the head, tilted back -->
    <g transform="translate(316 146) rotate(-6)">
      <path d="M0 -56 L52 18 L-52 18 Z" fill="url(#cbHat)"/>
      <ellipse cx="0" cy="18" rx="56" ry="8" fill="#C48E11"/>
      <path d="M-26 2 L26 2 M-15 -16 L15 -16" stroke="#B4810F"
            stroke-width="2.2" opacity=".65"/>
      <path d="M-52 18 q52 13 104 0" fill="none" stroke="#B4810F"
            stroke-width="2" opacity=".5"/>
    </g>
  </g>

  <!-- ── counter ──────────────────────────────────────────────────── -->
  <rect x="86" y="344" width="468" height="22" rx="7" fill="url(#cbTable)"/>
  <rect x="86" y="366" width="468" height="11" rx="5" fill="#05392B"/>

  <!-- produce on the counter -->
  <g transform="translate(468 300)">
    <path d="M0 44 q36 15 72 0 l-9-26 q-27 10-54 0z" fill="#D4A017"/>
    <circle cx="20" cy="16" r="14" fill="#228E57"/>
    <circle cx="46" cy="12" r="16" fill="#1A7C4A"/>
    <circle cx="34" cy="24" r="12" fill="#2C9F65"/>
  </g>
  <g transform="translate(104 316)">
    <path d="M0 28 q26 12 52 0 l-6-18 q-20 8-40 0z" fill="#C48E11"/>
    <circle cx="16" cy="11" r="11" fill="#C0453B"/>
    <circle cx="35" cy="9" r="12" fill="#C95448"/>
  </g>

  <!-- ── the handwritten day-book, lying on the counter ───────────── -->
  <g transform="translate(210 296) rotate(-3)">
    <rect x="2" y="4" width="184" height="58" rx="5" fill="#084C38" opacity=".13"/>
    <rect x="0" y="0" width="184" height="58" rx="5" fill="#fffdf6"
          stroke="#E5DCC8" stroke-width="2"/>
    <line x1="92" y1="6" x2="92" y2="52" stroke="#E5DCC8" stroke-width="2"/>
    <!-- money in -->
    <g stroke="#0B6E4F" stroke-width="2.6" stroke-linecap="round" opacity=".78">
      <path d="M12 16 h46 M12 28 h54 M12 40 h40"/>
    </g>
    <!-- money out -->
    <g stroke="#C0453B" stroke-width="2.6" stroke-linecap="round" opacity=".74">
      <path d="M104 16 h42 M104 28 h52"/>
    </g>
    <path d="M104 42 h58" stroke="#241F18" stroke-width="3"
          stroke-linecap="round" opacity=".55"/>
  </g>

  <!-- ── phone, aimed at the paper ────────────────────────────────── -->
  <g transform="translate(190 158) rotate(-14)">
    <rect x="3" y="5" width="60" height="98" rx="12" fill="#084C38" opacity=".16"/>
    <rect x="0" y="0" width="60" height="98" rx="12" fill="#241F18"/>
    <rect x="4" y="4" width="52" height="90" rx="9" fill="#FBF7EC"/>
    <rect x="20" y="8" width="20" height="4" rx="2" fill="#241F18" opacity=".3"/>
    <g stroke="#0B6E4F" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M14 28 h-4 v4 M46 28 h4 v4 M14 76 h-4 v-4 M46 76 h4 v-4"/>
    </g>
    <rect x="18" y="40" width="24" height="3" rx="1.5" fill="#0B6E4F" opacity=".5"/>
    <rect x="18" y="49" width="18" height="3" rx="1.5" fill="#D4A017" opacity=".75"/>
    <rect x="18" y="58" width="22" height="3" rx="1.5" fill="#C0453B" opacity=".45"/>
  </g>

  <!-- ── it lands in Zalo, already a ledger entry ─────────────────── -->
  <g transform="translate(438 128)">
    <rect x="0" y="0" width="152" height="78" rx="17" fill="#0068FF"/>
    <path d="M24 78 l14 19 l6-19z" fill="#0068FF"/>
    <rect x="16" y="19" width="86" height="7" rx="3.5" fill="#fff" opacity=".95"/>
    <rect x="16" y="35" width="114" height="7" rx="3.5" fill="#fff" opacity=".68"/>
    <rect x="16" y="51" width="62" height="7" rx="3.5" fill="#fff" opacity=".42"/>
    <circle cx="124" cy="23" r="10" fill="#D4A017"/>
    <path d="M119.5 23 l3.2 3.2 l6.3-7.2" stroke="#fff" stroke-width="2.7"
          fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- paper → Zalo -->
  <g stroke="#0B6E4F" fill="none" stroke-width="2.5" stroke-linecap="round"
     opacity=".42" stroke-dasharray="4 9">
    <path d="M392 300 q66-70 130-92"/>
  </g>
  <circle cx="392" cy="300" r="4" fill="#0B6E4F" opacity=".5"/>
</svg>
